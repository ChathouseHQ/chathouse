services:
  nginx:
    image: nginx:alpine
    ports:
      - '${PORT:-80}:80'
    volumes:
      - ./docker/nginx/docs.cloud:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - docs
    restart: unless-stopped

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    expose:
      - '5008'
    restart: unless-stopped
