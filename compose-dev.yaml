services:
  mariadb:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-rootpassword}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-chathouse}
      - MARIADB_SHADOW_DATABASE=${MARIADB_SHADOW_DATABASE:-chathouse_shadow}
      - MARIADB_USER=${MARIADB_USER:-chathouse}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-chathouse}
    ports:
      - '${MARIADB_PORT:-3307}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init-shadow-db.sh:/docker-entrypoint-initdb.d/10-init-shadow-db.sh:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
